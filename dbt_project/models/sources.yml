version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw ingested data from ad platforms"
    tables:
      - name: meta_campaigns
        description: "Raw Meta (Facebook) Ads campaign performance data"
        columns:
          - name: campaign_id
            description: "Meta campaign ID"
          - name: impressions
            description: "Number of times the ad was shown"
          - name: clicks
            description: "Number of clicks on the ad"
          - name: spend
            description: "Amount spent in USD"
          - name: ingestion_timestamp
            description: "When the data was ingested"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: ingestion_timestamp

      - name: google_campaigns
        description: "Raw Google Ads campaign performance data"
        columns:
          - name: campaign_id
            description: "Google campaign ID"
          - name: impressions
            description: "Number of times the ad was shown"
          - name: clicks
            description: "Number of clicks on the ad"
          - name: cost
            description: "Amount spent in USD"
          - name: ingestion_timestamp
            description: "When the data was ingested"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: ingestion_timestamp

      - name: meta_adsets
        description: "Raw Meta ad set data"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: ingestion_timestamp

      - name: google_keywords
        description: "Raw Google keyword data"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: ingestion_timestamp
