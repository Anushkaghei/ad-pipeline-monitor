[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-pipeline-monitor"
version = "1.0.0"
description = "ELT Observability Platform for Advertising Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "boto3>=1.35.81",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "APScheduler>=3.10.4",
    "rich>=13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
