ad_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'pipeline_user') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'pipeline_pass') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ad_pipeline') }}"
      schema: staging
      threads: 4
